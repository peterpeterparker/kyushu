[package]
name = "kyushu-cli"
version = "0.4.0"
edition = "2024"
repository.workspace = true

[[bin]]
name = "kyu"
path = "src/main.rs"

[features]
local-worker = []

[dependencies]
wasmtime = "49.0.0"
wasmtime-wasi = { version = "49.0.0", features = ["p3"] }
wasmtime-wasi-http = { version = "49.0.0", features = ["p3"] }
wasmtime-wizer = { version = "49.0.0", features = ["component-model", "wasmtime"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "macros"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hyper = { version = "1", features = ["http1", "server"] }
http-body = "1"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
rolldown = "1.0.0"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
mime_guess = "2.0.5"
walkdir = "2.5.0"
brotli = "8.0.4"
flate2 = "1.1.9"

[dev-dependencies]
tempfile = "3.27.0"
