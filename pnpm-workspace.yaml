packages:
  - packages/builder
  - packages/types
  - packages/worker
  - packages/docs
  - examples/env
  - examples/fetch
  - examples/file-system
  - examples/hello-world
  - examples/static-assets
  - tests

allowBuilds:
  esbuild: true
  sharp: false

minimumReleaseAge: 2880 # ignore dependency updates released less than 2 days ago

minimumReleaseAgeExclude:
  - kyushu-types@0.1.0
  - "@astrojs/markdown-satteri@0.4.2"
  - "@astrojs/starlight@0.42.3"
  - astro@7.3.4
